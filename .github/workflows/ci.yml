name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build the Example app
        run: |
          xcodebuild build \
            -project Omnibar.xcodeproj \
            -scheme Example \
            -destination 'platform=macOS'
